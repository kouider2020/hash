name: Build CMake 3.5 for Termux Bionic

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          wget \
          curl \
          unzip \
          pkg-config \
          python3 \
          python3-pip \
          libtool \
          autoconf \
          automake

    - name: Setup Termux sysroot
      run: |
        mkdir -p $HOME/termux-bionic
        cd $HOME/termux-bionic
        # Download Termux bionic sysroot (prebuilt headers + libs)
        wget https://github.com/termux/termux-packages/releases/download/bootstrap-2020/termux-bootstrap-bionic.tar.gz
        tar -xzf termux-bootstrap-bionic.tar.gz
        echo "Sysroot ready at $HOME/termux-bionic"

    - name: Download CMake 3.5 source
      run: |
        wget https://cmake.org/files/v3.5/cmake-3.5.2.tar.gz
        tar -xzf cmake-3.5.2.tar.gz
        mv cmake-3.5.2 cmake-src

    - name: Configure with Termux toolchain
      run: |
        mkdir build && cd build
        cmake ../cmake-src \
          -DCMAKE_SYSTEM_NAME=Android \
          -DCMAKE_SYSTEM_VERSION=21 \
          -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
          -DCMAKE_ANDROID_NDK=$HOME/termux-bionic \
          -DCMAKE_ANDROID_STL_TYPE=gnustl_shared \
          -DCMAKE_INSTALL_PREFIX=$HOME/cmake-termux \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Install
      run: |
        cd build
        make install
        tar -czf cmake-3.5.2-termux-bionic.tar.gz -C $HOME cmake-termux

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: cmake-3.5.2-termux-bionic
        path: build/cmake-3.5.2-termux-bionic.tar.gz
